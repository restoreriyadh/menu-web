<!DOCTYPE html>
<!--
  Restaurant Menu Website Template
  --------------------------------
  This page contains NO restaurant-specific content.
  Everything is rendered by js/app.js from data/restaurant.json.
  See README.md for customization instructions.
-->
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Restaurant Menu</title>
    <meta name="description" content="Restaurant menu" />
    <link id="favicon" rel="icon" href="data:," />
    <link rel="stylesheet" href="css/style.css" />
    <!-- Google Fonts are injected here at runtime (see loadFonts()) -->
    <script id="schema-jsonld" type="application/ld+json"></script>
  </head>

  <body>
    <!-- Shown only if data/restaurant.json fails to load -->
    <div id="fatal-error" class="fatal-error" hidden role="alert">
      <div>
        <h1>We couldn&rsquo;t load the menu</h1>
        <p>Please refresh the page or try again in a moment.</p>
      </div>
    </div>

    <!-- ============ HEADER ============ -->
    <header class="site-header" id="siteHeader">
      <div class="container header-inner">
        <a class="brand" href="#top" aria-label="Home">
          <img class="brand-logo" id="brandLogo" alt="" hidden />
          <span class="brand-name" id="brandName"></span>
        </a>
        <nav class="site-nav" aria-label="Main">
          <a href="#menu" data-scroll aria-label="Menu">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
            <span class="nav-label">Menu</span>
          </a>
          <a href="#location" data-scroll aria-label="Location">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z" /><circle cx="12" cy="10" r="2.5" /></svg>
            <span class="nav-label">Location</span>
          </a>
          <a href="#contact" data-scroll class="nav-contact" aria-label="Contact">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c1 .3 1.9.6 2.9.7a2 2 0 0 1 1.7 2Z" /></svg>
            <span class="nav-label">Contact</span>
          </a>
        </nav>
      </div>
    </header>

    <main id="top">
      <!-- ============ HERO ============ -->
      <section class="hero" id="hero">
        <img class="hero-img" id="heroImage" alt="" fetchpriority="high" />
        <div class="hero-overlay"></div>
        <div class="container hero-content">
          <p class="hero-eyebrow" id="heroCuisine"></p>
          <h1 class="hero-title" id="heroTitle"></h1>
          <p class="hero-subtitle" id="heroSubtitle"></p>
          <div class="hero-actions">
            <a class="btn btn-primary" href="#menu" data-scroll id="heroMenuBtn"></a>
            <a class="btn btn-ghost" href="#location" data-scroll id="heroLocationBtn"></a>
          </div>
        </div>
      </section>

      <!-- ============ MENU ============ -->
      <section class="section" id="menu">
        <div class="container">
          <header class="section-head">
            <h2 class="section-title" id="menuTitle">Our Menu</h2>
            <p class="section-sub" id="menuIntro"></p>
          </header>

          <!-- Sticky filter bar: search + YouTube-style category chips -->
          <div class="filter-bar" id="filterBar">
            <div class="search-wrap">
              <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2" />
                <path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              </svg>
              <input
                type="search"
                id="menuSearch"
                class="search-input"
                placeholder="Search our menu..."
                aria-label="Search our menu"
              />
            </div>
            <div class="chips-scroller">
              <div class="chips" id="categoryChips" role="tablist" aria-label="Menu categories"></div>
            </div>
          </div>

          <div class="menu-grid" id="menuGrid"></div>
          <p class="empty-state" id="emptyState" hidden>No menu items found.</p>
        </div>
      </section>

      <!-- ============ CONTACT + LOCATION ============ -->
      <section class="section section-alt" id="location">
        <div class="container">
          <header class="section-head">
            <h2 class="section-title">Visit Us</h2>
          </header>

          <div class="visit-grid">
            <div class="visit-card" id="contact">
              <h3 class="visit-name" id="locationName"></h3>
              <p class="visit-address" id="locationAddress"></p>

              <ul class="hours" id="openingHours" hidden></ul>

              <div class="visit-actions">
                <a class="btn btn-primary" id="callBtn" hidden>Call</a>
                <a class="btn btn-outline" id="whatsappBtn" target="_blank" rel="noopener" hidden>WhatsApp</a>
                <a class="btn btn-outline" id="directionsBtn" target="_blank" rel="noopener" hidden>Get Directions</a>
              </div>

              <p class="visit-email" id="emailLine" hidden></p>
            </div>

            <div class="map-card" id="mapCard" hidden>
              <iframe
                id="mapFrame"
                title="Restaurant location map"
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"
              ></iframe>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- ============ FOOTER ============ -->
    <footer class="site-footer">
      <div class="container footer-inner">
        <div class="footer-brand">
          <img class="footer-logo" id="footerLogo" alt="" hidden />
          <span id="footerName"></span>
        </div>
        <div class="footer-links" id="footerLinks"></div>
        <p class="footer-copy" id="footerCopy"></p>
      </div>
    </footer>

    <script src="js/restaurant-data.js"></script>	
    <script src="js/app.js"></script>
  </body>
</html>
